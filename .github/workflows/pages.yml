name: Deploy to GitHub Pages

on:
  push:
    # The repository's default branch is the feature branch, so deploy from it too.
    branches: [main, master, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Gate the deploy on the app actually building a valid scene: the dimensional table,
      # the mesh-integrity pass and every authored camera view all have to come back clean.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      # Only the default branch publishes. Any claude/** push used to deploy to the same
      # Pages environment, so two feature branches raced each other for production.
      - if: github.ref_name != github.event.repository.default_branch
        # Block scalar, not a plain one: the message contains ": " and a plain YAML scalar
        # cannot, so it was being read as a nested mapping and the workflow failed to parse.
        run: |
          echo "::notice::Rama ${{ github.ref_name }} - comprobaciones en verde, sin desplegar (solo publica la rama por defecto)."
      - if: github.ref_name == github.event.repository.default_branch
        # The artifact was `path: .`, which shipped node_modules and the Playwright cache
        # alongside the site. Assemble just what the page needs.
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r src vendor docs _site/
      - if: github.ref_name == github.event.repository.default_branch
        uses: actions/configure-pages@v5
      - if: github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - if: github.ref_name == github.event.repository.default_branch
        id: deployment
        uses: actions/deploy-pages@v4
