name: Deploy to GitHub Pages

on:
  push:
    # The repository's default branch is the feature branch, so deploy from it too.
    # Every branch the project pushes to is gated the same way, the audit branch included.
    branches: [main, master, 'claude/**', 'codex/**', 'grok/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One queue per branch: the same commit is pushed to three branches at once, and a single
# shared group cancelled two of the three checks every time.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The gate in six parts that run side by side: one runner took ~13 min for the whole of
  # `npm run check`, most of it the scene walk and the interface checks one after the other.
  # The deploy waits for all six; `npm run check` still runs the lot locally. The Cybertruck Lab
  # has a job of its own: it shares the renderer, and its textures would otherwise count in the
  # scene budget of check.mjs if it ran first in the same browser.
  check:
    # Pinned: ubuntu-latest moved to 26.04 (October 2026), where Playwright 1.56.1 cannot install Chromium.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        part:
          - { name: static, run: 'npm run check:static', browser: false }
          - { name: scene, run: 'npm run check:scene', browser: true }
          - { name: interface, run: 'npm run check:ux', browser: true }
          - { name: level-of-detail, run: 'npm run check:lod', browser: true }
          - { name: render-cache, run: 'npm run check:cache', browser: true }
          - { name: cybertruck-lab, run: 'npm run check:cybertruck', browser: true }
    name: check (${{ matrix.part.name }})
    steps:
      - uses: actions/checkout@v4
      # Gate every change on the app actually building a valid scene: the dimensional table,
      # the mesh-integrity pass and every authored camera view all have to come back clean.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - if: matrix.part.browser
        run: npx playwright install --with-deps chromium
      - run: ${{ matrix.part.run }}

  deploy:
    # The github-pages environment only accepts production deployments. Keep feature-branch
    # validation in the check job so it is not rejected by the environment before a runner starts.
    if: github.ref_name == github.event.repository.default_branch
    needs: check
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p _site
          cp index.html _site/
          cp -r src vendor docs assets _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
