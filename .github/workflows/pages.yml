name: Deploy to GitHub Pages

on:
  push:
    # The repository's default branch is the feature branch, so deploy from it too.
    branches: [main, master, 'claude/**', 'codex/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Gate every change on the app actually building a valid scene: the dimensional table,
      # the mesh-integrity pass and every authored camera view all have to come back clean.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run check

  deploy:
    # The github-pages environment only accepts production deployments. Keep feature-branch
    # validation in the check job so it is not rejected by the environment before a runner starts.
    if: github.ref_name == github.event.repository.default_branch
    needs: check
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p _site
          cp index.html _site/
          cp -r src vendor docs _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
